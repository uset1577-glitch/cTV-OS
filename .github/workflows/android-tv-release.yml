name: Build & Release Android TV APK (OTA)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Versión manual opcional (ej: 1.2.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-android-tv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configurar Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar dependencias y compilar frontend
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Sincronizar proyecto Capacitor Android
        run: npx cap sync android

      - name: Validar secrets de firma persistente
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Faltan secrets de firma Android (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD). Ejecuta scripts/generate-keystore.sh una sola vez y agrégalos en GitHub Secrets para mantener una firma persistente en todas las actualizaciones OTA."
            exit 1
          fi

      - name: Decodificar keystore persistente
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > android/app/release-keystore.jks

      - name: Calcular versión y versionCode incremental
        id: version
        run: |
          VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          if [ -n "${{ github.event.inputs.version_name }}" ]; then
            VERSION_NAME="${{ github.event.inputs.version_name }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF#refs/tags/v}"
          else
            VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          fi
          TAG_NAME="v${VERSION_NAME}"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Compilar APK Release firmado con Java 21
        working-directory: android
        env:
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PappVersionCode="${{ steps.version.outputs.version_code }}" \
            -PappVersionName="${{ steps.version.outputs.version_name }}" \
            -PRELEASE_STORE_FILE="release-keystore.jks" \
            -PRELEASE_STORE_PASSWORD="$STORE_PASS" \
            -PRELEASE_KEY_ALIAS="$KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$KEY_PASS"

      - name: Preparar APK y version.json para OTA
        run: |
          mkdir -p dist-release
          APK_SRC="android/app/build/outputs/apk/release/app-release.apk"
          APK_NAME="CTVOS-v${{ steps.version.outputs.version_name }}.apk"
          cp "$APK_SRC" "dist-release/${APK_NAME}"
          FILE_SIZE=$(stat -c%s "dist-release/${APK_NAME}")
          APK_URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag_name }}/${APK_NAME}"
          PUBLISHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          cat <<EOF > dist-release/version.json
          {
            "versionCode": ${{ steps.version.outputs.version_code }},
            "versionName": "${{ steps.version.outputs.version_name }}",
            "apkUrl": "${APK_URL}",
            "fileSizeBytes": ${FILE_SIZE},
            "publishedAt": "${PUBLISHED_AT}",
            "mandatory": false,
            "releaseNotes": "Compilación automática CTV OS ${{ steps.version.outputs.tag_name }} (Build ${{ steps.version.outputs.version_code }}) firmada con llave persistente para actualización OTA en Android TV."
          }
          EOF

      - name: Limpiar keystore temporal
        if: always()
        run: rm -f android/app/release-keystore.jks

      - name: Publicar APK y version.json en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: "CTV OS ${{ steps.version.outputs.tag_name }}"
          make_latest: true
          generate_release_notes: true
          files: |
            dist-release/CTVOS-v${{ steps.version.outputs.version_name }}.apk
            dist-release/version.json
