name: Build & Release Android TV APK (OTA)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Versión manual opcional (ej: 1.2.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-android-tv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar dependencias y compilar frontend
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Sincronizar proyecto Capacitor Android
        run: npx cap sync android

      - name: Restaurar caché de keystore automático (si no hay secrets)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' }}
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: android/app/release-keystore.jks
          key: ctvos-signing-keystore-v1
          restore-keys: |
            ctvos-signing-keystore-

      - name: Preparar llave de firma persistente
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SECRET_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SECRET_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$SECRET_STORE_PASS" ] && [ -n "$SECRET_KEY_ALIAS" ] && [ -n "$SECRET_KEY_PASS" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > android/app/release-keystore.jks
            echo "::add-mask::$SECRET_STORE_PASS"
            echo "::add-mask::$SECRET_KEY_PASS"
            echo "store_password=$SECRET_STORE_PASS" >> "$GITHUB_OUTPUT"
            echo "key_alias=$SECRET_KEY_ALIAS" >> "$GITHUB_OUTPUT"
            echo "key_password=$SECRET_KEY_PASS" >> "$GITHUB_OUTPUT"
            echo "using_secrets=true" >> "$GITHUB_OUTPUT"
          else
            DEFAULT_ALIAS="ctvos"
            DEFAULT_PASS="ctvos-release-key-2026"
            if [ ! -f android/app/release-keystore.jks ]; then
              echo "Generando keystore automático persistente en caché..."
              keytool -genkeypair \
                -v \
                -keystore android/app/release-keystore.jks \
                -alias "$DEFAULT_ALIAS" \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -storepass "$DEFAULT_PASS" \
                -keypass "$DEFAULT_PASS" \
                -dname "CN=CTV OS, OU=TV, O=CgamesTV, L=Local, ST=Local, C=ES"
            else
              echo "Usando keystore persistente restaurado de caché."
            fi
            echo "store_password=$DEFAULT_PASS" >> "$GITHUB_OUTPUT"
            echo "key_alias=$DEFAULT_ALIAS" >> "$GITHUB_OUTPUT"
            echo "key_password=$DEFAULT_PASS" >> "$GITHUB_OUTPUT"
            echo "using_secrets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Calcular versión y versionCode incremental
        id: version
        run: |
          VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          if [ -n "${{ github.event.inputs.version_name }}" ]; then
            VERSION_NAME="${{ github.event.inputs.version_name }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF#refs/tags/v}"
          else
            VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          fi
          TAG_NAME="v${VERSION_NAME}"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Compilar APK Release firmado con Java 21
        working-directory: android
        env:
          STORE_PASS: ${{ steps.signing.outputs.store_password }}
          KEY_ALIAS: ${{ steps.signing.outputs.key_alias }}
          KEY_PASS: ${{ steps.signing.outputs.key_password }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PappVersionCode="${{ steps.version.outputs.version_code }}" \
            -PappVersionName="${{ steps.version.outputs.version_name }}" \
            -PRELEASE_STORE_FILE="release-keystore.jks" \
            -PRELEASE_STORE_PASSWORD="$STORE_PASS" \
            -PRELEASE_KEY_ALIAS="$KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$KEY_PASS"

      - name: Preparar APK y version.json para OTA
        run: |
          mkdir -p dist-release
          APK_SRC="android/app/build/outputs/apk/release/app-release.apk"
          APK_NAME="CTVOS-v${{ steps.version.outputs.version_name }}.apk"
          cp "$APK_SRC" "dist-release/${APK_NAME}"
          FILE_SIZE=$(stat -c%s "dist-release/${APK_NAME}")
          APK_URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag_name }}/${APK_NAME}"
          PUBLISHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          cat <<EOF > dist-release/version.json
          {
            "versionCode": ${{ steps.version.outputs.version_code }},
            "versionName": "${{ steps.version.outputs.version_name }}",
            "apkUrl": "${APK_URL}",
            "fileSizeBytes": ${FILE_SIZE},
            "publishedAt": "${PUBLISHED_AT}",
            "mandatory": false,
            "releaseNotes": "Compilación automática CTV OS ${{ steps.version.outputs.tag_name }} (Build ${{ steps.version.outputs.version_code }}) firmada para actualización OTA en Android TV."
          }
          EOF

      - name: Publicar APK y version.json en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: "CTV OS ${{ steps.version.outputs.tag_name }}"
          make_latest: true
          generate_release_notes: true
          files: |
            dist-release/CTVOS-v${{ steps.version.outputs.version_name }}.apk
            dist-release/version.json

      - name: Guardar resumen de compilación
        run: |
          echo "### CTV OS ${{ steps.version.outputs.tag_name }} compilado correctamente" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK: \`CTVOS-v${{ steps.version.outputs.version_name }}.apk\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build (versionCode): \`${{ steps.version.outputs.version_code }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.signing.outputs.using_secrets }}" = "false" ]; then
            echo "- Firma: Keystore automático persistente en caché de GitHub Actions (sin configuración manual)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Firma: Keystore fijo desde GitHub Secrets." >> "$GITHUB_STEP_SUMMARY"
          fi
